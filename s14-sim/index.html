<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S14 Drift Suspension Lab</title>
  </head>
  <body>
    <aside id="panel"><h1>S14 · Wisefab V2<small>обучающий симулятор подвески — этап 4: графики, баланс руля, чувствительность</small></h1></aside>
    <main>
      <div id="stage"><div id="view"></div>
      <div id="cams">
        <button data-cam="free">Свободная</button>
        <button data-cam="front-left">Перед</button>
        <button data-cam="top">Сверху</button>
        <button data-cam="side">Сбоку</button>
        <label class="tog"><input type="checkbox" id="mode-drift" checked /> Занос</label>
        <label class="tog"><input type="checkbox" id="mode-auto" checked /> Авто-контрруль</label>
      </div>
      <div id="rightcol"><div id="hud"></div><div id="balance"></div></div>
      <div id="drift"></div>
      </div>
      <div id="charts">
        <div class="tabs">
          <button data-tab="main" class="on">Руль и занос</button>
          <button data-tab="tire">Шина</button>
          <button data-tab="sens">Чувствительность</button>
          <span class="spacer"></span>
          <button id="fold-charts">▾ Свернуть графики</button>
        </div>
        <div class="pane" id="pane-main"></div>
        <div class="pane" id="pane-tire" hidden></div>
        <div class="pane" id="pane-sens" hidden></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
